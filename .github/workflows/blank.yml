# Save this file as: .github/workflows/metrics.yml
# Requires a repository secret named METRICS_TOKEN (classic personal access token).
name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]   # refresh daily
  workflow_dispatch:                 # allows manual runs from the Actions tab
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Sonuverma0625
          filename: assets/github-metrics.svg
          config_timezone: Asia/Kolkata

          # --- Layout: 3 columns like the reference screenshot ---
          # (if this value is rejected, change it to: large)
          config_display: columns

          # --- Left + middle blocks: profile header, stats, repositories ---
          base: header, activity, community, repositories, metadata
          base_indepth: yes

          # "1.52m added, 379k removed"
          plugin_lines: yes

          # "Coding habits and recent activity" (hour-of-day / day-of-week charts)
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # 3D "Contributions calendar"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # "Most used languages" bar
          plugin_languages: yes

          # "Mastered technologies and topics" icon grid
          # NOTE: this reads the topics you have STARRED on GitHub (github.com/topics)
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0

          # PageSpeed Insights panel for your portfolio
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://sonuportfolio0625.netlify.app

          # --- Optional panels (uncomment after filling in your own values) ---

          # "Suggested tracks": random songs from a playlist you choose.
          # Use the EMBED url of a Spotify or Apple Music playlist.
          # plugin_music: yes
          # plugin_music_playlist: PASTE_EMBED_PLAYLIST_URL_HERE
          # plugin_music_limit: 2

          # "1 Project": needs a GitHub Projects board.
          # plugin_projects: yes
          # plugin_projects_repositories: Sonuverma0625/REPO_NAME/projects/1
